<!DOCTYPE html>
<html>
<head>
    <title>Online Book Store</title>
</head>
<body>
    <h1>Online Book Store</h1>

    <table border="1">
        <tr>
            <th>Book Name</th>
            <th>Price</th>
        </tr>

        {% for book in books %}
        <tr>
            <td>{{ book.name }}</td>
            <td>{{ book.price }}</td>
        </tr>
        {% endfor %}
    </table>

</body>
</html>
